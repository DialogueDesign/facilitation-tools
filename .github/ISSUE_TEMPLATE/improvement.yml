name: 改善・不具合
description: 既存ツールの改善や不具合の修正を提案する
title: "[改善] "
labels: ["改善", "レビュー待ち"]
body:
  - type: input
    id: tool
    attributes:
      label: 対象のツール
      placeholder: 例）speaker-picker
    validations:
      required: true
  - type: textarea
    id: situation
    attributes:
      label: 気づいた場面
      description: どの研修・場面で使っていて、何が起きたか（何に困ったか）。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: どうなってほしいか
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完成の条件
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: 確認したいこと
